name: Build NOVA BOOST APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Adicionar plataforma Android
        run: npx cap add android

      - name: Sincronizar arquivos HTML
        run: npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-boost-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

### 📂 Estrutura necessária no GitHub

Confere se os arquivos estão organizados assim:

```text
seu-repositorio/
├── .github/
│   └── workflows/
│       └── android-apk.yml
├── www/
│   └── index.html
├── package.json
└── capacitor.config.json

⚠️ Atenção

O workflow precisa que o "package.json" contenha as dependências do Capacitor. Além disso, o comando "npx cap add android" só funciona se a configuração do projeto estiver correta.

Para compilar: abre a aba Actions do repositório, seleciona "Build NOVA BOOST APK" e toca em Run workflow. Quando terminar, baixa o artefato "nova-boost-debug-apk".

Se aparecer algum erro vermelho no GitHub Actions, manda uma captura de tela que te ajudo a corrigir. 🔧
