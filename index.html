<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Deco GD</title>
<style>
:root{--bg:#f3f1fb;--card:#fff;--tx:#17143a;--mu:#6a6590;--ac:#1fb5a6;--acx:#fff;--bd:#d9d5ee;--er:#c0304f;--pv:#8a84c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102a;--card:#1c1940;--tx:#ece9ff;--mu:#9d98c8;--ac:#35e0d0;--acx:#0d0b22;--bd:#33307a;--er:#ff7a93;--pv:#5b56a8}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Trebuchet MS",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 32px}
h1{font-size:24px;margin:0 0 12px;letter-spacing:-.5px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;margin:0;padding:11px;background:transparent;color:var(--mu);font-size:15px}
.tabs button[aria-selected=true]{background:var(--ac);color:var(--acx)}
.pg[hidden]{display:none}
section{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 8px}
p.s{margin:6px 0 0;color:var(--mu);font-size:13px;line-height:1.4}
label.l{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=number],select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac)}
button,.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:16px;font-weight:700;margin-top:8px;text-align:center;cursor:pointer;font-family:inherit}
button:disabled{opacity:.4}
.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row>*{flex:1}
canvas{width:100%;height:170px;background:var(--bg);border-radius:10px;border:1px solid var(--bd);display:block}
#log{font-size:13px;line-height:1.5;color:var(--mu);white-space:pre-wrap}
#log.e{color:var(--er)}
.tl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd);font-size:14px}
.tl button{width:auto;margin:0;padding:6px 12px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Auto Deco</h1>
<div class="tabs" role="tablist">
<button role="tab" id="t1" aria-selected="true">Decorar</button>
<button role="tab" id="t2" aria-selected="false">Meus temas</button>
</div>

<div class="pg" id="p1">
<section>
<h2>Nível</h2>
<label class="btn" for="f">Abrir nível (.gmd)</label>
<input type="file" id="f" hidden>
<p class="s" id="info">Exporte um nível pelo GD e abra aqui.</p>
</section>
<section>
<h2>Seleção e tema</h2>
<label class="l" for="g">Grupo dos objetos a decorar (vazio = nível todo)</label>
<input type="number" id="g" inputmode="numeric" placeholder="ex.: 999">
<label class="l" for="t">Tema</label>
<select id="t"></select>
<label class="l" for="d">Densidade: <b id="dv">60</b>%</label>
<input type="range" id="d" min="5" max="100" value="60">
<p class="s">No editor do GD, coloque os objetos escolhidos num grupo antes de exportar.</p>
</section>
<button id="go" disabled>Auto Deco</button>
<section style="margin-top:12px">
<canvas id="cv" width="480" height="240"></canvas>
<p class="s" style="margin-top:8px">Prévia: objetos em roxo, decoração em verde-água.</p>
<div class="row"><button id="rr" class="g" disabled>Refazer</button><button id="dl" disabled>Baixar .gmd</button></div>
<div id="log" style="margin-top:10px">Aguardando um arquivo.</div>
</section>
</div>

<div class="pg" id="p2" hidden>
<section>
<h2>Criar tema</h2>
<label class="l" for="nn">Nome</label>
<input type="text" id="nn" placeholder="ex.: Neve">
<label class="l" for="nm">Forma</label>
<select id="nm"><option value="around">Em volta do objeto</option><option value="corners">Nos 4 cantos</option><option value="top">Só em cima</option></select>
<div class="row">
<div><label class="l" for="n1">Qtd. mín.</label><input type="number" id="n1" value="1" min="1" max="8"></div>
<div><label class="l" for="n2">Qtd. máx.</label><input type="number" id="n2" value="3" min="1" max="8"></div>
</div>
<label class="l" for="rr2">Alcance (unidades)</label>
<input type="number" id="rr2" value="35" min="8" max="120">
<div class="row">
<div><label class="l" for="s1">Escala mín.</label><input type="number" id="s1" value="0.1" step="0.05" min="0.05" max="2"></div>
<div><label class="l" for="s2">Escala máx.</label><input type="number" id="s2" value="0.25" step="0.05" min="0.05" max="2"></div>
</div>
<label class="l" for="ro">Rotação</label>
<select id="ro"><option value="0">Nenhuma</option><option value="45">45°</option><option value="-1">Aleatória</option></select>
<button id="sv">Salvar tema</button>
</section>
<section><h2>Seus temas</h2><div id="tl"><p class="s">Nenhum tema seu ainda.</p></div></section>
</div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var BASE={cantos:{n:'Cantos',mode:'corners',n1:4,n2:4,r:15,s1:.2,s2:.2,ro:0},
 pixels:{n:'Pixels',mode:'around',n1:1,n2:3,r:35,s1:.1,s2:.25,ro:0},
 brilho:{n:'Brilho',mode:'top',n1:2,n2:2,r:20,s1:.15,s2:.3,ro:45}};
var mine=[];
try{mine=JSON.parse(localStorage.getItem('adtemas')||'[]')}catch(e){}
function saveMine(){try{localStorage.setItem('adtemas',JSON.stringify(mine))}catch(e){}}
function all(){var o=[];for(var k in BASE)o.push(BASE[k]);return o.concat(mine)}
function fill(){
 var s=$('t'),cur=s.value;s.innerHTML='';
 all().forEach(function(t,i){var o=document.createElement('option');o.value=i;o.textContent=t.n+(i>=3?' (meu)':'');s.appendChild(o)});
 if(cur)s.value=cur;
 var l=$('tl');l.innerHTML='';
 if(!mine.length){l.innerHTML='<p class="s">Nenhum tema seu ainda.</p>';return}
 mine.forEach(function(t,i){
  var d=document.createElement('div');d.className='tl';
  var sp=document.createElement('span');sp.textContent=t.n;
  var b=document.createElement('button');b.className='g';b.textContent='Apagar';
  b.onclick=function(){mine.splice(i,1);saveMine();fill()};
  d.appendChild(sp);d.appendChild(b);l.appendChild(d)});
}
fill();
function tab(n){
 $('p1').hidden=n!==1;$('p2').hidden=n!==2;
 $('t1').setAttribute('aria-selected',n===1);$('t2').setAttribute('aria-selected',n===2)}
$('t1').onclick=function(){tab(1)};$('t2').onclick=function(){tab(2)};
$('sv').onclick=function(){
 var nm=$('nn').value.trim()||('Tema '+(mine.length+1));
 var n1=Math.max(1,+$('n1').value||1),n2=Math.max(n1,+$('n2').value||n1);
 mine.push({n:nm,mode:$('nm').value,n1:n1,n2:n2,r:+$('rr2').value||35,
  s1:+$('s1').value||.1,s2:Math.max(+$('s1').value||.1,+$('s2').value||.2),ro:+$('ro').value});
 saveMine();fill();$('t').value=all().length-1;$('nn').value='';tab(1)};
var gmd='',lvl=null,out=null,fname='nivel',sel=[],add=[];
$('d').oninput=function(){$('dv').textContent=$('d').value};
function say(m,e){$('log').textContent=m;$('log').className=e?'e':''}
async function gz(b,dec){var s=new (dec?DecompressionStream:CompressionStream)('gzip'),w=s.writable.getWriter();w.write(b);w.close();return new Uint8Array(await new Response(s.readable).arrayBuffer())}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function b64e(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_')}
function field(k){var m=gmd.match(new RegExp('<k>'+k+'</k><s>([\\s\\S]*?)</s>'));return m?m[1]:null}
function parseObj(s){var p=s.split(','),m={};for(var i=0;i+1<p.length;i+=2)m[p[i]]=p[i+1];return m}
function rnd(a,b){return a+Math.random()*(b-a)}
function gen(x,y,t){
 var o=[],n=t.n1+Math.floor(Math.random()*(t.n2-t.n1+1)),r=t.r;
 if(t.mode==='corners'){[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(c){o.push([x+c[0]*r,y+c[1]*r,rnd(t.s1,t.s2),t.ro<0?rnd(0,90):t.ro])})}
 else for(var i=0;i<n;i++){
  var px=t.mode==='top'?x+rnd(-r,r):x+rnd(-r,r),py=t.mode==='top'?y+24+rnd(0,r):y+rnd(-r,r);
  o.push([px,py,rnd(t.s1,t.s2),t.ro<0?rnd(0,90):t.ro])}
 return o}
function draw(){
 var c=$('cv'),g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);
 if(!sel.length)return;
 var a=[0,1e9,0,1e9];var xs=sel.map(function(p){return p[0]}),ys=sel.map(function(p){return p[1]});
 var x0=Math.min.apply(null,xs)-40,x1=Math.max.apply(null,xs)+40,y0=Math.min.apply(null,ys)-40,y1=Math.max.apply(null,ys)+40;
 var k=Math.min(W/(x1-x0),H/(y1-y0));
 function P(p,col,sz){g.fillStyle=col;g.fillRect((p[0]-x0)*k,H-(p[1]-y0)*k,sz,sz)}
 var st=Math.max(1,Math.floor(sel.length/4000));
 for(var i=0;i<sel.length;i+=st)P(sel[i],'#8a84c4',Math.max(2,30*k));
 var s2=Math.max(1,Math.floor(add.length/6000));
 for(i=0;i<add.length;i+=s2)P(add[i],'#35e0d0',Math.max(1.5,30*k*add[i][2]))}
$('f').onchange=async function(){
 out=null;$('dl').disabled=true;$('go').disabled=true;$('rr').disabled=true;sel=[];add=[];draw();
 var f=$('f').files[0];if(!f)return;
 try{
  gmd=await f.text();fname=f.name.replace(/\.[^.]+$/,'');
  var k4=field('k4');
  if(!k4)throw new Error('não achei os dados do nível (k4). Exporte como .gmd pelo GD.');
  var str=new TextDecoder().decode(await gz(b64d(k4),true)),parts=str.split(';');
  lvl={head:parts[0],objs:parts.slice(1).filter(Boolean)};
  $('info').textContent=(field('k2')||fname)+': '+lvl.objs.length+' objetos';
  $('go').disabled=false;say('Nível lido. Escolha o tema e aperte Auto Deco.');
 }catch(e){lvl=null;$('info').textContent='';say('Erro ao ler: '+e.message,1)}};
async function run(){
 if(!lvl)return;
 var g=$('g').value.trim(),dens=$('d').value/100,t=all()[+$('t').value]||BASE.cantos,MAX=20000,lines=[];
 sel=[];add=[];
 lvl.objs.forEach(function(s){
  var m=parseObj(s);
  if(g&&(m['57']||'').split('.').indexOf(g)<0)return;
  var x=parseFloat(m['2']),y=parseFloat(m['3']);
  if(isNaN(x)||isNaN(y))return;
  sel.push([x,y]);
  if(Math.random()>dens)return;
  gen(x,y,t).forEach(function(d){if(add.length<MAX){add.push(d);lines.push('1,1,2,'+d[0].toFixed(1)+',3,'+d[1].toFixed(1)+',32,'+d[2].toFixed(2)+',6,'+Math.round(d[3])+',121,1')}})});
 if(!sel.length){say('Nenhum objeto no grupo '+g+'. Confira o número.',1);draw();return}
 try{
  var k4=b64e(await gz(new TextEncoder().encode(lvl.head+';'+lvl.objs.concat(lines).join(';')+';'),false));
  var name=(field('k2')||fname)+' (deco)';
  out=gmd.replace(/(<k>k4<\/k><s>)[\s\S]*?(<\/s>)/,function(_,a,b){return a+k4+b})
         .replace(/(<k>k2<\/k><s>)[\s\S]*?(<\/s>)/,function(_,a,b){return a+name+b});
  $('dl').disabled=false;$('rr').disabled=false;draw();
  say('Selecionados: '+sel.length+'\nObjetos de deco: '+add.length+(add.length>=MAX?' (limite atingido)':'')+'\nBaixe o arquivo e importe no GD.');
 }catch(e){say('Erro ao gerar: '+e.message,1)}}
$('go').onclick=run;$('rr').onclick=run;
$('dl').onclick=async function(){
 if(!out)return;
 var nm=fname+'-deco.gmd',C=window.Capacitor,P=C&&C.Plugins;
 if(P&&P.Filesystem){
  try{
   await P.Filesystem.writeFile({path:nm,data:out,directory:'DOCUMENTS',encoding:'utf8'});
   var u=await P.Filesystem.getUri({path:nm,directory:'DOCUMENTS'});
   say('Salvo em Documentos/'+nm+'\nImporte no GD pelo botão de importar nível.');
   if(P.Share){try{await P.Share.share({title:nm,url:u.uri})}catch(e){}}
   return;
  }catch(e){say('Erro ao salvar: '+e.message,1);return}
 }
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));
 a.download=nm;document.body.appendChild(a);a.click();a.remove()};
})();
</script>
</body>
</html>
