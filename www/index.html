const az=Math.abs(p.z),sz=Math.sign(p.z);if(az>L-BR){if(Math.abs(p.x)<GW&&p.y<GH){if(az>L+GD-BR){p.z=sz*(L+GD-BR);v.z*=-.4}if(Math.abs(p.x)>GW-BR){p.x=Math.sign(p.x)*(GW-BR);v.x*=-.4}if(p.y>GH-BR){p.y=GH-BR;v.y*=-.4}if(az>L+BR&&state=='play')goal(sz>0?0:1)}else if(az<L+BR){p.z=sz*(L-BR);if(v.z*sz>0)v.z*=-.7}}
const s=v.length();if(s>.1){tv.set(v.z,0,-v.x).normalize();bm.rotateOnWorldAxis(tv,s*h/BR)}}
function goal(t){if(t)sc1++;else sc0++;$('s0').textContent=sc0;$('s1').textContent=sc1;state='goal';tm=3;endAfter=ot;flash(t?'GOL LARANJA!':'GOL AZUL!',0);snd(4)}
function demo(v,a){v.dead=true;v.rs=3;v.g.visible=false;v.sh.visible=false;boom(v.pos);snd(5);if(a.pl)flash('DEMOLIÇÃO!',1);if(v.pl)flash('VOCÊ FOI DEMOLIDO',1.5)}
function carsCol(){const N=cars.length;for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=cars[i],b=cars[j];if(a.dead||b.dead)continue;tn.copy(b.pos).sub(a.pos);const dy=Math.abs(tn.y);tn.y=0;const d=tn.length();if(d>=3.4||dy>1.8||d<1e-3)continue;tn.divideScalar(d);
if(a.team!=b.team){const sa=a.vel.length(),sb=b.vel.length(),ta_=sa>SS&&a.vel.dot(tn)>sa*.5,tb_=sb>SS&&b.vel.dot(tn)<-sb*.5;if(ta_||tb_){if(ta_)demo(b,a);if(tb_)demo(a,b);continue}}
const o=(3.4-d)/2;a.pos.addScaledVector(tn,-o);b.pos.addScaledVector(tn,o);tv.copy(b.vel).sub(a.vel);const r=tv.dot(tn);if(r<0){a.vel.addScaledVector(tn,r*.5);b.vel.addScaledVector(tn,-r*.5)}}}
function sim(h,first){
if(state=='count'){tm-=h;if(tm<=0){state='play';flash('JÁ!',.8);snd(7)}else{const n=Math.ceil(tm);if(n!=lastN){lastN=n;flash(String(n),0);snd(6)}}return}
if(state=='play'){clock-=h;if(clock<=0){if(sc0!=sc1)return end();ot=true;clock=0;if(!lastOT){lastOT=1;flash('GOL DE OURO!',1.5)}}}
const pin={steer:kb.x||S.x,pitch:kb.y||S.y,thr:(K.gas?1:0)-(K.brake?1:0),boost:!!K.boost,drift:!!K.drift,roll:!!K.roll,jump:first&&jE};if(first)jE=false;
for(const c of cars){if(c.dead){c.rs-=h;if(c.rs<=0)spawn(c);continue}stepCar(c,c.pl?pin:bot(c,h),h)}
padsUpd(h);carsCol();for(const c of cars)ballHit(c);stepBall(h);
if(state=='goal'){tm-=h;if(tm<=0){if(endAfter)end();else{flash('',0);kick()}}}}
$('go').onclick=start;
/* ===== ONLINE na mesma rede, por código (WebRTC, host autoritativo) ===== */
const NET={role:0,gs:[],ok:0,cs:0,ans:'',sn:0,hc:[]},Bt=V();
const enc=d=>btoa(JSON.stringify(d)),dec=s=>JSON.parse(atob(s.trim())),f3=x=>Math.round(x*1000)/1000;
const wi=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,3500)});
document.body.insertAdjacentHTML('beforeend','<div id="nt"></div>');
$('go').insertAdjacentHTML('afterend','<button class="car" id="nh">CRIAR SALA (código)</button><button class="car" id="nj">ENTRAR COM CÓDIGO</button>');
const f0=flash,snd0=snd,end0=end,sim0=sim,sc_=stepCar;
flash=(t,s)=>{f0(t,s);if(NET.role=='h'&&/^(\d|GOL|JÁ|$)/.test(t))netSend({f:[t,s]})};
snd=t=>{snd0(t);if(NET.role=='h'&&(t==0||t>=4&&t!=8))netSend({s:t})};
end=()=>{end0();if(NET.role=='h')netSend({e:1,a:sc0,b:sc1})};
sim=(h,fi)=>{if(NET.role!='g')sim0(h,fi)};
stepCar=(c,i,h)=>sc_(c,c.rm?rin(c):i,h);
function rin(c){const r=c.rin,o={steer:r.steer,pitch:r.pitch,thr:r.thr,boost:r.boost,drift:r.drift,roll:r.roll,jump:r.jump};r.jump=false;return o}
function netSend(o){const s=JSON.stringify(o);NET.gs.forEach(g=>{if(g.ok&&g.ch.readyState=='open')g.ch.send(s)})}
async function hostOffer(){const pc=new RTCPeerConnection({iceServers:[]}),ch=pc.createDataChannel('g'),g={pc,ch,ok:false,code:''};NET.gs.push(g);netUI();
ch.onopen=()=>{g.ok=true;netUI()};ch.onclose=()=>{g.ok=false;netUI()};ch.onmessage=e=>onMsg(g,JSON.parse(e.data));
await pc.setLocalDescription(await pc.createOffer());await wi(pc);g.code=enc(pc.localDescription);netUI()}
async function joinRoom(code){const pc=new RTCPeerConnection({iceServers:[]});NET.pc=pc;
pc.ondatachannel=e=>{const ch=e.channel;NET.ch=ch;ch.onopen=()=>{NET.ok=1;netUI()};ch.onclose=()=>{NET.ok=0;netUI()};ch.onmessage=e=>onMsg(null,JSON.parse(e.data))};
await pc.setRemoteDescription(dec(code));await pc.setLocalDescription(await pc.createAnswer());await wi(pc);NET.ans=enc(pc.localDescription);netUI()}
function onMsg(g,m){if(m.i){if(g&&g.car){const r=g.car.rin,a=m.i;r.steer=a[0];r.pitch=a[1];r.thr=a[2];r.boost=!!a[3];r.drift=!!a[4];r.roll=!!a[5];if(a[6])r.jump=true}}
else if(m.init)buildG(m);else if(m.sn)applySn(m.sn);else if(m.f)f0(m.f[0],m.f[1]);else if(m.s!=null)snd0(m.s);
else if(m.e){end0();const me=cars[0];if(me&&me.team==1)$('mt').textContent=m.b>m.a?'VITÓRIA! '+m.b+' x '+m.a:'DERROTA '+m.b+' x '+m.a}}
function netGo(){const live=NET.gs.filter(g=>g.ok);if(!live.length)return alert('Conecte pelo menos um amigo.');let n=ST.n;if(live.length+1>2*n)ST.n=n=Math.ceil((live.length+1)/2);
start();$('nt').style.display='none';const sl=[];for(let k=0;k<n;k++){if(k)sl.push([0,k]);sl.push([1,k])}
live.forEach((g,j)=>{const s=sl[j],c=cars[s[0]*n+s[1]];c.pl=true;c.rm=j+1;c.rin={steer:0,pitch:0,thr:0,boost:false,drift:false,roll:false,jump:false};g.car=c;g.you=s[0]*n+s[1]});
live.forEach(g=>g.ch.send(JSON.stringify({init:1,n,gm:ST.gm,inf:ST.inf,dur:ST.dur,cs:cars.map(c=>[c.team,c.ty]),you:g.you})))}
function buildG(m){cars.forEach(c=>{sc.remove(c.g);sc.remove(c.sh)});cars=[];NET.hc=[];
m.cs.forEach((a,hi)=>{const k=mk(a[1],a[0]),c={team:a[0],ty:a[1],pl:false,g:k.g,fl2:k.fl,sh:mkSh(2.2,2.2),pos:V(),vel:V(),q:new T.Quaternion(),fw:V(0,0,1),nrm:V(0,1,0),on:true,dead:false,bst:false,bo:0,tp:V(),tq:new T.Quaternion(),hi};cars.push(c);NET.hc[hi]=c});
const me=NET.hc[m.you];cars.splice(cars.indexOf(me),1);cars.unshift(me);me.pl=true;Object.assign(ST,{n:m.n,gm:m.gm,inf:m.inf,dur:m.dur});mkPads();
sc0=sc1=0;$('s0').textContent=0;$('s1').textContent=0;$('menu').style.display='none';$('nt').style.display='none';state='count';NET.cs=1;NET.sn=0;lastN=0}
function applySn(s){if(!NET.cs)return;const st=['count','play','goal'][s.t];if(st&&state!='over'&&state!='menu')state=st;tm=s.tm;clock=s.cl;ot=!!s.o;
if(s.a!==sc0||s.b!==sc1){sc0=s.a;sc1=s.b;$('s0').textContent=sc0;$('s1').textContent=sc1}
Bt.set(s.bl[0],s.bl[1],s.bl[2]);B.v.set(s.bl[3],s.bl[4],s.bl[5]);if(!NET.sn)B.p.copy(Bt);
s.c.forEach((a,i)=>{const c=NET.hc[i];if(!c)return;c.tp.set(a[0],a[1],a[2]);c.tq.set(a[3],a[4],a[5],a[6]);c.vel.set(a[7],a[8],a[9]);c.dead=!!(a[10]&1);c.bst=!!(a[10]&2);c.on=!!(a[10]&4);c.bo=a[11];c.g.visible=c.sh.visible=!c.dead;if(!NET.sn){c.pos.copy(c.tp);c.q.copy(c.tq)}});
NET.sn=1;pads.forEach((p,i)=>{p.m.visible=s.p[i]!='0'})}
(function gl(){requestAnimationFrame(gl);if(NET.role!='g'||!NET.cs||!NET.sn)return;for(const c of cars){c.pos.lerp(c.tp,.4);c.q.slerp(c.tq,.4);c.g.position.copy(c.pos);c.g.quaternion.copy(c.q);c.fw.set(0,0,1).applyQuaternion(c.q);c.nrm.set(0,1,0).applyQuaternion(c.q)}
B.p.lerp(Bt,.4);const s=B.v.length();if(s>.1){tv.set(B.v.z,0,-B.v.x).normalize();bm.rotateOnWorldAxis(tv,s/60/BR)}})();
setInterval(()=>{if(NET.role=='h'){if(!NET.gs.some(g=>g.ok&&g.car))return;
const sn={t:['count','play','goal','over'].indexOf(state),tm:f3(tm),cl:f3(clock),a:sc0,b:sc1,o:ot?1:0,bl:[B.p.x,B.p.y,B.p.z,B.v.x,B.v.y,B.v.z].map(f3),
c:cars.map(c=>[c.pos.x,c.pos.y,c.pos.z,c.q.x,c.q.y,c.q.z,c.q.w,c.vel.x,c.vel.y,c.vel.z,(c.dead?1:0)|(c.bst?2:0)|(c.on?4:0),c.bo|0].map(f3)),p:pads.map(p=>p.m.visible?1:0).join('')};
netSend({sn})}
else if(NET.role=='g'&&NET.ok&&NET.cs&&NET.ch.readyState=='open'&&['count','play','goal'].includes(state)){const j=jE;jE=false;NET.ch.send(JSON.stringify({i:[kb.x||S.x,kb.y||S.y,(K.gas?1:0)-(K.brake?1:0),K.boost?1:0,K.drift?1:0,K.roll?1:0,j?1:0]}))}},33);
function netUI(){const n=$('nt');if(!NET.role){n.style.display='none';return}n.style.display='flex';
if(NET.role=='h')n.innerHTML='<h3>SALA — HOST</h3><small>Mesmo Wi-Fi. Envie cada código a um amigo e cole a resposta dele.</small>'+NET.gs.map((g,i)=>`<div>Amigo ${i+1}: ${g.ok?'✅ conectado':'⏳ aguardando'}`+(g.ok?'':`<br><textarea readonly rows="2">${g.code||'gerando…'}</textarea><br><button data-a="cp" data-i="${i}">COPIAR CÓDIGO</button><br><textarea id="ans${i}" rows="2" placeholder="cole a resposta do amigo"></textarea><br><button data-a="ok" data-i="${i}">CONECTAR</button>`)+'</div>').join('')+'<div><button data-a="more">+ CONVIDAR</button><button data-a="go">INICIAR</button><button data-a="x">SAIR</button></div>';
else n.innerHTML='<h3>ENTRAR NA SALA</h3>'+(NET.ans?`<small>Envie esta resposta ao host:</small><textarea readonly rows="3">${NET.ans}</textarea><br><button data-a="cp" data-i="a">COPIAR</button><p>${NET.ok?'✅ Conectado! Aguarde o host iniciar.':'⏳ Aguardando o host conectar…'}</p>`:'<small>Cole o código do host:</small><textarea id="jc" rows="3"></textarea><br><button data-a="join">GERAR RESPOSTA</button>')+'<br><button data-a="x">SAIR</button>'}
$('nt').onclick=async e=>{const d=e.target.dataset;if(!d.a)return;
if(d.a=='more')hostOffer();
else if(d.a=='ok'){try{await NET.gs[d.i].pc.setRemoteDescription(dec($('ans'+d.i).value))}catch(x){alert('Código inválido')}}
else if(d.a=='cp'){try{await navigator.clipboard.writeText(d.i=='a'?NET.ans:NET.gs[d.i].code)}catch(x){}}
else if(d.a=='join'){try{await joinRoom($('jc').value)}catch(x){alert('Código inválido')}}
else if(d.a=='go')netGo();
else if(d.a=='x'){NET.gs.forEach(g=>g.pc.close());if(NET.pc)NET.pc.close();NET.role=0;NET.gs=[];NET.ok=0;NET.cs=0;NET.ans='';$('nt').style.display='none'}};
$('nh').onclick=()=>{if(!NET.role){NET.role='h';NET.gs=[];hostOffer()}netUI()};
$('nj').onclick=()=>{if(!NET.role)NET.role='g';netUI()};
addEventListener('contextmenu',e=>e.preventDefault());
</script></body></html>
